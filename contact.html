<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Pixelxcript Systems</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body>
  <header class="bg-gray-900 text-white py-4 flex items-center justify-center">
  <img src="assets/pixelscript_logo.svg" alt="Pixelxcript Logo" class="h-16 w-16 mr-3">
  <h1 class="text-2xl font-bold">Pixelxcript Systems</h1>
</header>

  <h1 class="fade-in text-3xl font-bold text-center mt-10">Contact Us</h1>


  <!-- Carousel -->
  <section class="carousel">
    <div class="carousel-container">
      <div class="slide active">
        <img src="assets/door.jpg" alt="Door Installation">
        <p>Secure Door Installation</p>
      </div>
      <div class="slide">
        <img src="assets/cctv.jpg" alt="CCTV Installation">
        <p>Reliable CCTV Solutions</p>
      </div>
      <div class="slide">
        <img src="assets/drawing.jpg" alt="Architectural Drawing">
        <p>Professional Architectural Drawings</p>
      </div>
      <div class="slide">
        <img src="assets/hardware.jpg" alt="Hardware Installation">
        <p>Modern Hardware Installations</p>
      </div>
    </div>
    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>
  </section>

  <!-- Contact form -->
  <form name="contactForm" onsubmit="return validateForm()">
    <label>Name:</label><input type="text" name="name"><br>
    <label>Email:</label><input type="email" name="email"><br>
    <label>Message:</label><textarea name="message"></textarea><br>
    <button type="submit">Send</button>
  </form>

  <script src="assets/script.js"></script>
</body>
</html>
