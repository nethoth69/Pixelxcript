<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelxcript Systems</title>
  <link rel="icon" type="image/svg+xml" href="assets/pixelxcript_logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Header -->
  <header class="bg-gray-900 text-white">
    <nav class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
      <!-- Logo + Name -->
      <div class="flex items-center space-x-3">
        <img src="assets/pixelxcript_logo.svg" alt="Pixelxcript Logo" class="h-10 w-10">
        <span class="text-xl font-bold">Pixelxcript Systems</span>
      </div>

      <!-- Navigation Links (Desktop) -->
      <ul class="hidden md:flex space-x-6 font-semibold">
        <li><a href="index.html" class="hover:text-yellow-400 transition">Home</a></li>
        <li><a href="services.html" class="hover:text-yellow-400 transition">Services</a></li>
        <li><a href="about.html" class="hover:text-yellow-400 transition">About</a></li>
        <li><a href="contact.html" class="hover:text-yellow-400 transition">Contact</a></li>
      </ul>

      <!-- Mobile Hamburger -->
      <div class="md:hidden text-2xl cursor-pointer" onclick="toggleMenu()">&#9776;</div>
    </nav>

    <!-- Mobile Menu -->
    <ul id="mobileMenu" class="hidden flex-col bg-gray-800 text-white space-y-4 px-6 py-4 md:hidden">
      <li><a href="index.html" class="hover:text-yellow-400 transition">Home</a></li>
      <li><a href="services.html" class="hover:text-yellow-400 transition">Services</a></li>
      <li><a href="about.html" class="hover:text-yellow-400 transition">About</a></li>
      <li><a href="contact.html" class="hover:text-yellow-400 transition">Contact</a></li>
    </ul>
  </header>

  <!-- Hero Carousel with Overlay -->
  <section class="relative w-full max-w-5xl mx-auto mt-10 overflow-hidden rounded-lg shadow-lg">
    <div class="carousel">
      <div class="carousel-slide relative">
        <img src="assets/door.jpg" alt="Door Installation" class="w-full h-96 object-cover">
        <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
          <h1 class="text-3xl md:text-5xl font-bold text-white">Welcome to Pixelxcript Systems</h1>
        </div>
      </div>
      <div class="carousel-slide hidden relative">
        <img src="assets/cctv.jpg" alt="CCTV Installation" class="w-full h-96 object-cover">
        <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
          <h1 class="text-3xl md:text-5xl font-bold text-white">Secure CCTV Solutions</h1>
        </div>
      </div>
      <div class="carousel-slide hidden relative">
        <img src="assets/drawing.jpg" alt="Architectural Drawing" class="w-full h-96 object-cover">
        <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
          <h1 class="text-3xl md:text-5xl font-bold text-white">Professional Architectural Designs</h1>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="absolute top-1/2 left-4 transform -translate-y-1/2 bg-gray-800 text-white px-3 py-1 rounded prev">&#10094;</button>
    <button class="absolute top-1/2 right-4 transform -translate-y-1/2 bg-gray-800 text-white px-3 py-1 rounded next">&#10095;</button>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white text-center py-6 mt-16">
    <div class="flex items-center justify-center space-x-3">
      <img src="assets/pixelxcript_logo.svg" alt="Pixelxcript Logo" class="h-8 w-8">
      <p>&copy; 2026 Pixelxcript Systems. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts at the end -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }

    // Simple JS Carousel
    const slides = document.querySelectorAll('.carousel-slide');
    let current = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('hidden', i !== index);
      });
    }

    document.querySelector('.next').addEventListener('click', () => {
      current = (current + 1) % slides.length;
      showSlide(current);
    });

    document.querySelector('.prev').addEventListener('click', () => {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    });

    // Auto-play every 5 seconds
    setInterval(() => {
      current = (current + 1) % slides.length;
      showSlide(current);
    }, 5000);

    // Initialize
    showSlide(current);
  </script>
</body>
</html>
